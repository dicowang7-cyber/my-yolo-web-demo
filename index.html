<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TensorFlow.js Model Loader</title>

  <!-- Load TensorFlow.js -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.19.0/dist/tf.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    #preview {
      max-width: 300px;
      margin-top: 10px;
      border-radius: 6px;
    }

    .loading {
      color: blue;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <h2>TensorFlow.js Model Loader</h2>

  <p>Status: <span id="status">Loading model...</span></p>

  <input type="file" id="imgInput" accept="image/*" />
  <br />
  <img id="preview" />

  <pre id="result"></pre>

  <script src="script.js"></script>
</body>
</html>
