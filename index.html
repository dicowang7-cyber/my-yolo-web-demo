<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍎 Deteksi Buah Real-Time (YOLOv8-int8)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🍌 Deteksi Buah Real-Time (TFJS)</h1>
            <p>Model deteksi objek YOLOv8 (8-bit quantized) berjalan langsung di browser Anda.</p>
        </header>

        <div class="video-container">
            <video id="webcam" autoplay muted playsinline></video>
            
            <canvas id="canvas" class="overlay"></canvas>
            
            <div id="status" class="status-box loading">
                Memuat Model... Tunggu sebentar.
            </div>
        </div>

        <div class="stats-container">
            <span id="fps">FPS: 0</span>
            <span id="class-count">Total Deteksi: 0</span>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
    
    <script src="script.js"></script>
</body>
</html>
