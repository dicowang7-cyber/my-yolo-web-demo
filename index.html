<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deteksi Objek | TensorFlow.js</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            background-color: #f0f0f0;
            padding: 20px;
        }
        #loading-container {
            margin-bottom: 20px;
            font-size: 1.2em;
            text-align: center;
        }
        #video-container {
            position: relative;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            background-color: #fff;
        }
        video, canvas {
            display: block;
        }
        #webcam {
            width: 640px; /* Sesuaikan ukuran video */
            height: 480px;
        }
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
        }
        .detection-box {
            position: absolute;
            border: 2px solid #00ff44;
            color: white;
            font-size: 14px;
            padding: 2px 5px;
            text-shadow: 1px 1px 2px black;
            font-weight: bold;
            box-sizing: border-box;
            background-color: rgba(0, 255, 68, 0.4); /* Background transparan */
            pointer-events: none; /* Agar tidak menghalangi interaksi */
            z-index: 10;
        }
        .detection-label {
            position: absolute;
            top: -20px;
            left: 0;
            white-space: nowrap;
            background-color: #00ff44;
            color: black;
            padding: 1px 4px;
            font-size: 12px;
            z-index: 11;
        }
    </style>
</head>
<body>

    <h1>🚀 Deteksi Objek Kustom</h1>

    <div id="loading-container">
        Memuat model: <span id="loading-percent">0%</span>
    </div>

    <div id="video-container" style="display: none;">
        <video id="webcam" autoplay muted playsinline></video>
        </div>

    <script src="script.js"></script>

</body>
</html>
