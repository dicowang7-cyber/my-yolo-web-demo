<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YOLOv8 Web Realtime Detection</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.2.0/dist/tf.min.js"></script>

<style>
    body {
        background: radial-gradient(circle at top, #2b2b2b, #1a1a1a);
        color: #fff;
        margin: 0;
        font-family: "Segoe UI", Arial;
        text-align: center;
        padding: 20px;
    }

    h1 {
        font-size: 2rem;
        margin-bottom: 8px;
        letter-spacing: 1px;
        font-weight: 600;
    }

    #status-container {
        margin-bottom: 20px;
        font-size: 1.1em;
        opacity: 0.9;
    }

    #status { 
        color: #4cff4c; 
        font-weight: bold;
    }

    /* PROGRESS BAR STYLE */
    #progress-bar {
        width: 320px;
        height: 12px;
        background-color: #444;
        margin: 10px auto 0 auto;
        border-radius: 6px;
        overflow: hidden;
        display: none;
        border: 1px solid #666;
    }
    #progress-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #00ff8a, #32ff32);
        transition: width 0.2s;
    }

    /* VIDEO WRAPPER */
    #video-container {
        position: relative;
        display: inline-block;
        box-shadow: 0px 0px 25px rgba(0, 255, 170, 0.25);
        border-radius: 12px;
        border: 2px solid rgba(0, 255, 150, 0.22);
        overflow: hidden;
        margin-top: 20px;
    }

    /* Video disembunyikan total agar TIDAK muncul 2 video */
    #video {
        display: none !important;
    }

    #canvas {
        position: relative;
        z-index: 10;
        display: block;
    }
</style>
</head>
<body>

<h1>YOLO Realtime Detection</h1>

<div id="status-container">
    <span id="status">Starting...</span>
    <div id="progress-bar"><div id="progress-fill"></div></div>
</div>

<div id="video-container">
    <video id="video" playsinline muted></video>
    <canvas id="canvas"></canvas>
</div>

<script>
/* ————————— CONFIG ————————— */
const MODEL_URL = "https://xmrz7019w0uk3zke.public.blob.vercel-storage.com/model.json";

const statusEl = document.getElementById("status");
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const progressBar = document.getElementById("progress-bar");
const progressFill = document.getElementById("progress-fill");

let model = null;
const INPUT_SIZE = 640;
const SCORE_THRESHOLD = 0.1;
const NMS_IOU = 0.45;
const MAX_OUTPUT = 50;
const NUM_CLASSES = 16;

const CLASS_NAMES = [
    "Alpukat","Anggur","Apel","Apel Hijau","Jeruk","Lemon","Mangga","Melon",
    "Nanas","Pepaya","Pir","Pisang","Rambutan","Salak","Semangka","Stroberi"
];

/* ————————— UTILITIES ————————— */
function sigmoid(x){ return 1/(1+Math.exp(-x)); }
function softmax(arr){
    const m = Math.max(...arr);
    const ex = arr.map(v=>Math.exp(v-m));
    const sum = ex.reduce((a,b)=>a+b);
    return ex.map(e=>e/sum);
}
function xywh_to_xyxy(x,y,w,h){
    return [x-w/2, y-h/2, x+w/2, y+h/2];
}

/* ————————— DRAW BOXES ————————— */
function drawBoxes(boxes) {
    // gambar video yang sudah di-mirror
    ctx.save();
    ctx.scale(-1, 1);
    ctx.translate(-canvas.width, 0);
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    ctx.restore();

    // gambar bounding box
    boxes.forEach(b => {
        const scaledX1 = b.x1 * (canvas.width / INPUT_SIZE);
        const scaledX2 = b.x2 * (canvas.width / INPUT_SIZE);
        const scaledY1 = b.y1 * (canvas.height / INPUT_SIZE);
        const scaledY2 = b.y2 * (canvas.height / INPUT_SIZE);

        const x = canvas.width - scaledX2;
        const y = scaledY1;
        const w = scaledX2 - scaledX1;
        const h = scaledY2 - scaledY1;

        ctx.strokeStyle = "lime";
        ctx.lineWidth = Math.max(2, canvas.width / 200);
        ctx.strokeRect(x, y, w, h);

        // label
        const label = `${CLASS_NAMES[b.classId]} ${(b.score*100).toFixed(1)}%`;
        ctx.font = "18px Segoe UI";
        const tw = ctx.measureText(label).width;

        ctx.fillStyle = "rgba(0,0,0,0.55)";
        ctx.fillRect(x, y - 22, tw + 8, 22);

        ctx.fillStyle = "lime";
        ctx.fillText(label, x + 4, y - 6);
    });
}

/* ————————— POSTPROCESS ————————— */
async function postprocess(out) {
    let t = out;
    const trans = tf.tidy(() => t.squeeze().transpose());
    const arr = await trans.array();
    trans.dispose();

    const boxes = [], scores = [], classIds = [];

    for (let i = 0; i < arr.length; i++){
        const row = arr[i];
        const [x,y,w,h] = row;
        const probs = softmax(row.slice(4));
        const maxProb = Math.max(...probs);
        const classId = probs.indexOf(maxProb);

        if (maxProb < SCORE_THRESHOLD) continue;

        const [x1,y1,x2,y2] = xywh_to_xyxy(x,y,w,h);
        boxes.push([y1*INPUT_SIZE, x1*INPUT_SIZE, y2*INPUT_SIZE, x2*INPUT_SIZE]);
        scores.push(maxProb);
        classIds.push(classId);
    }

    if (!boxes.length) return [];

    const b = tf.tensor2d(boxes);
    const s = tf.tensor1d(scores);
    const idx = await tf.image.nonMaxSuppressionAsync(b,s,MAX_OUTPUT,NMS_IOU,SCORE_THRESHOLD);
    const sel = await idx.array();

    const final = [];
    sel.forEach(i => {
        const [y1,x1,y2,x2] = boxes[i];
        final.push({x1,y1,x2,y2, score:scores[i], classId:classIds[i]});
    });

    b.dispose(); s.dispose(); idx.dispose();
    return final;
}

/* ————————— INIT MODEL ————————— */
async function loadModel(){
    try{
        statusEl.textContent = "Loading model...";
        progressBar.style.display = "block";

        model = await tf.loadGraphModel(MODEL_URL, {
            onProgress: p => {
                progressFill.style.width = `${p*100}%`;
                statusEl.textContent = `Loading model... ${(p*100).toFixed(1)}%`;
            }
        });

        progressBar.style.display = "none";
        statusEl.textContent = "Model loaded.";
    } catch(e){
        statusEl.textContent = "Failed loading model.";
        console.error(e);
    }
}

/* ————————— CAMERA ————————— */
async function setupCamera(){
    const stream = await navigator.mediaDevices.getUserMedia({
        video:{ facingMode:"environment" },
        audio:false
    });
    video.srcObject = stream;
    await new Promise(r=>video.onloadedmetadata=r);
    video.play();

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    document.getElementById("video-container").style.width = video.videoWidth+"px";
    document.getElementById("video-container").style.height = video.videoHeight+"px";
}

/* ————————— LOOP ————————— */
async function detectLoop() {
    if (!model) return;

    tf.engine().startScope();

    const inp = tf.tidy(() => {
        const img = tf.browser.fromPixels(video);
        return img.resizeBilinear([INPUT_SIZE,INPUT_SIZE]).div(255).expandDims(0);
    });

    let out = null;
    try {
        const res = await model.executeAsync(inp);
        out = Array.isArray(res) ? res[0] : res;
    } catch(e){
        console.error("Inference error:", e);
        tf.dispose(inp);
        tf.engine().endScope();
        requestAnimationFrame(detectLoop);
        return;
    }

    const det = await postprocess(out);
    drawBoxes(det);

    tf.dispose([inp,out]);
    tf.engine().endScope();

    requestAnimationFrame(detectLoop);
}

/* ————————— MAIN ————————— */
(async () => {
    await loadModel();
    await setupCamera();
    statusEl.textContent = "Model ready — Detecting...";
    detectLoop();
})();
</script>

</body>
</html>
