<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOLOv8 Web Realtime Detection (Smooth Camera)</title>
    <style>
        body {
            background-color: #1e1e1e;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        h1 {
            color: #ffffff;
            font-size: 2em;
            margin-bottom: 10px;
        }
        #status-container {
            margin-bottom: 20px;
            font-size: 1.1em;
            color: #b0b0b0;
            text-align: center;
        }
        #status {
            color: lime;
            font-weight: bold;
        }
        /* Style untuk progress bar, video, canvas tetap sama */
        #progress-bar {
            width: 300px; height: 10px; background-color: #555; margin-top: 5px; border-radius: 5px; overflow: hidden; display: none;
        }
        #progress-fill {
            height: 100%; width: 0%; background-color: lime; transition: width 0.3s;
        }
        #video-container {
            position: relative; width: 640px; height: 480px; overflow: hidden; border: 3px solid #333; border-radius: 8px;
        }
        #canvas {
            position: absolute; top: 0; left: 0; z-index: 10;
        }
        #video {
            visibility: hidden; position: absolute;
        }
    </style>
</head>
<body>
    <h1>YOLO Web Realtime Detection 🚀</h1>
    
    <div id="status-container">
        <span id="status">Starting up...</span>
        <div id="progress-bar">
            <div id="progress-fill"></div>
        </div>
        <div id="fps-info"></div>
    </div>

    <div id="video-container">
        <video id="video" playsinline muted></video>
        <canvas id="canvas"></canvas>
    </div>

    <script>
        const statusEl = document.getElementById('status');
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const progressBar = document.getElementById('progress-bar');
        const progressFill = document.getElementById('progress-fill');
        const fpsInfoEl = document.getElementById('fps-info');

        // --- KONFIGURASI ---
        const INFERENCE_FPS = 10; // Target inferensi (misalnya 10 FPS)
        const MS_PER_INFERENCE = 1000 / INFERENCE_FPS; // Waktu minimum antar inferensi (100ms)
        let lastInferenceTime = 0;
        let worker;

        // --- MIRRORING VIDEO (Hanya Rendering Frame Kamera) ---

        // Menggambar video dan hasil deteksi ke canvas
        function drawFrame(boxes = []) {
            // 1. Gambar frame video dengan MIRRORING
            ctx.save();
            ctx.scale(-1, 1);
            ctx.translate(-canvas.width, 0); 
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            ctx.restore(); // Kembalikan konteks ke normal

            // 2. Gambar deteksi
            boxes.forEach(b => {
                // Skala koordinat dari ukuran model (640) ke ukuran canvas
                const scaledX1 = b.x1 * (canvas.width / 640);
                const scaledX2 = b.x2 * (canvas.width / 640);
                const scaledY1 = b.y1 * (canvas.height / 640);
                const scaledY2 = b.y2 * (canvas.height / 640);
                
                // Terapkan formula MIRRORING ke koordinat X deteksi
                const x = canvas.width - scaledX2; 
                const y = scaledY1;
                const w = scaledX2 - scaledX1;
                const h = scaledY2 - scaledY1;
                
                // Box
                ctx.strokeStyle = "lime";
                ctx.lineWidth = Math.max(2, Math.round(Math.min(canvas.width, canvas.height) / 200));
                ctx.strokeRect(x, y, w, h);

                // Label
                const label = `${b.className} ${(b.score*100).toFixed(1)}%`; 
                ctx.font = "18px Arial";
                const textW = ctx.measureText(label).width;
                const pad = 6;
                
                // Label bg
                ctx.fillStyle = "rgba(0,0,0,0.6)";
                ctx.fillRect(x, y - 22, textW + pad, 22);

                // Text
                ctx.fillStyle = "lime";
                ctx.fillText(label, x + 4, y - 6);
            });
        }

        let detectionsCache = []; // Menyimpan hasil deteksi terakhir

        // --- Main Animation Loop (HARUS SMOOTH) ---
        function animationLoop(now) {
            // Gambar frame terbaru kamera
            drawFrame(detectionsCache); 

            // Cek apakah sudah waktunya menjalankan inferensi lagi
            if (now - lastInferenceTime > MS_PER_INFERENCE && worker) {
                
                // Ambil data gambar dari canvas (GPU-accelerated jika WebGL)
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                
                // Kirim data pixel ke Web Worker untuk inferensi.
                // Menggunakan Transferable Objects (imageData.data.buffer) untuk kecepatan maksimum
                worker.postMessage({
                    type: 'INFER',
                    imageData: imageData.data.buffer,
                    width: canvas.width,
                    height: canvas.height
                }, [imageData.data.buffer]); // Transfer buffer ownership
                
                lastInferenceTime = now;
            }

            requestAnimationFrame(animationLoop);
        }

        // --- Setup Worker dan Listener ---
        function setupWorker() {
            // Inisialisasi Web Worker
            worker = new Worker('yolo-worker.js');

            worker.onmessage = (event) => {
                const data = event.data;

                if (data.type === 'LOADING') {
                    progressBar.style.display = 'block';
                    statusEl.textContent = `Loading model... ${data.progress.toFixed(1)}%`;
                    progressFill.style.width = `${data.progress}%`;
                } else if (data.type === 'LOADED') {
                    progressBar.style.display = 'none';
                    statusEl.textContent = "Model ready — running detection.";
                    console.log("Worker ready: Model loaded.");
                } else if (data.type === 'ERROR') {
                    statusEl.textContent = `Worker Error: ${data.message}`;
                    console.error("Worker Error:", data.message);
                } else if (data.type === 'RESULT') {
                    // Update deteksi, ini akan digunakan di drawFrame() pada frame berikutnya
                    detectionsCache = data.boxes; 
                    
                    // Tampilkan FPS Inferensi (opsional)
                    fpsInfoEl.textContent = `Inferensi: ${data.fps.toFixed(1)} FPS`;
                }
            };

            // Kirim konfigurasi awal ke worker
            worker.postMessage({
                type: 'INIT',
                modelUrl: "https://xmrz7019w0uk3zke.public.blob.vercel-storage.com/model.json"
            });
        }

        // --- Setup Kamera ---
        async function setupCamera() {
            // ... (Kode setupCamera sama seperti yang Anda miliki)
            try {
                // Menggunakan 'user' (kamera depan) untuk mempermudah mirroring
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "user" }, 
                    audio: false
                });
                video.srcObject = stream;
                await new Promise(resolve => video.onloadedmetadata = resolve);
                video.play();
                
                // Atur ukuran canvas
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                document.getElementById('video-container').style.width = `${video.videoWidth}px`;
                document.getElementById('video-container').style.height = `${video.videoHeight}px`;

                // Mulai loop animasi setelah kamera siap
                animationLoop(0); 

            } catch (err) {
                console.error("Camera error:", err);
                statusEl.textContent = "Camera error. Allow camera and reload.";
            }
        }

        // --- Main Execution ---
        (async () => {
            // 1. Siapkan Worker
            setupWorker();
            
            // 2. Siapkan Kamera
            await setupCamera();
        })();
    </script>
</body>
</html>
