<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YOLOv8 Web Realtime Detection — FIXED</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.2.0/dist/tf.min.js"></script>

<style>
    body {
        background: radial-gradient(circle at top, #2b2b2b, #1a1a1a);
        color: #fff;
        margin: 0;
        font-family: "Segoe UI", Arial;
        text-align: center;
        padding: 20px;
    }

    h1 {
        font-size: 2rem;
        margin-bottom: 8px;
        letter-spacing: 1px;
        font-weight: 600;
    }

    #status-container {
        margin-bottom: 20px;
        font-size: 1.1em;
        opacity: 0.9;
    }

    #status { 
        color: #4cff4c; 
        font-weight: bold;
    }

    /* Progress bar */
    #progress-bar {
        width: 320px;
        height: 12px;
        background-color: #444;
        margin: 10px auto 0 auto;
        border-radius: 6px;
        overflow: hidden;
        display: none;
        border: 1px solid #666;
    }
    #progress-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #00ff8a, #32ff32);
        transition: width 0.2s;
    }

    #video-container {
        position: relative;
        display: inline-block;
        box-shadow: 0px 0px 25px rgba(0, 255, 170, 0.25);
        border-radius: 12px;
        border: 2px solid rgba(0, 255, 150, 0.22);
        overflow: hidden;
        margin-top: 20px;
    }

    #video {
        display: none !important;
    }
    #canvas {
        position: relative;
        z-index: 10;
        display: block;
    }
</style>
</head>
<body>

<h1>YOLO Realtime Detection</h1>

<div id="status-container">
    <span id="status">Starting...</span>
    <div id="progress-bar"><div id="progress-fill"></div></div>
</div>

<div id="video-container">
    <video id="video" playsinline muted></video>
    <canvas id="canvas"></canvas>
</div>

<script>
/* ----------------------------------------------------------- */
/* CONFIG */
const MODEL_URL = "./model.json"; // SESUAI PERMINTAAN

await tf.setBackend("webgl");
await tf.ready();

const statusEl = document.getElementById("status");
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const progressBar = document.getElementById("progress-bar");
const progressFill = document.getElementById("progress-fill");

let model = null;
const INPUT_SIZE = 320;        // FPS BOOST (640 → 320)
const SCORE_THRESHOLD = 0.25;
const NMS_IOU = 0.45;
const MAX_OUTPUT = 50;

const CLASS_NAMES = [
    "Alpukat","Anggur","Apel","Apel Hijau","Jeruk","Lemon","Mangga","Melon",
    "Nanas","Pepaya","Pir","Pisang","Rambutan","Salak","Semangka","Stroberi"
];

/* ----------------------------------------------------------- */
/* DRAW BOXES */
function drawBoxes(det) {
    ctx.save();
    ctx.scale(-1, 1);
    ctx.translate(-canvas.width, 0);
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    ctx.restore();

    det.forEach(b => {
        const scaleX = canvas.width  / INPUT_SIZE;
        const scaleY = canvas.height / INPUT_SIZE;

        const x1 = canvas.width - (b.x2 * scaleX);
        const y1 = b.y1 * scaleY;
        const w  = (b.x2 - b.x1) * scaleX;
        const h  = (b.y2 - b.y1) * scaleY;

        ctx.strokeStyle = "lime";
        ctx.lineWidth = 2;
        ctx.strokeRect(x1, y1, w, h);

        const label = `${CLASS_NAMES[b.classId]} ${(b.score*100).toFixed(1)}%`;
        ctx.font = "18px Segoe UI";
        const tw = ctx.measureText(label).width;

        ctx.fillStyle = "rgba(0,0,0,0.55)";
        ctx.fillRect(x1, y1 - 22, tw + 8, 22);

        ctx.fillStyle = "lime";
        ctx.fillText(label, x1 + 4, y1 - 6);
    });
}

/* ----------------------------------------------------------- */
/* FIXED POSTPROCESS — UNIVERSAL YOLOv8 FORMAT HANDLER */
function fastPostprocess(outputTensor, scoreThreshold) {
    let t = outputTensor.squeeze(); // [N, row] or [row, N]

    // auto fix orientation
    if (t.shape[0] < t.shape[1]) {
        t = t.transpose(); // ensure [N, rowSize]
    }

    const [N, rowSize] = t.shape;
    const raw = t.dataSync();

    const expected = CLASS_NAMES.length;
    const numClasses = rowSize - 4;   // dynamic class count

    if (numClasses !== expected) {
        console.warn("⚠ Model output class count mismatch:", numClasses, "expected:", expected);
    }

    const boxes = [];
    const scores = [];
    const classIds = [];

    for (let i = 0; i < N; i++) {
        const base = i * rowSize;

        const x = raw[base + 0];
        const y = raw[base + 1];
        const w = raw[base + 2];
        const h = raw[base + 3];

        // softmax
        let maxLogit = -Infinity;
        for (let c = 4; c < rowSize; c++) {
            const v = raw[base + c];
            if (v > maxLogit) maxLogit = v;
        }

        let sumExp = 0;
        const exps = [];
        for (let c = 4; c < rowSize; c++) {
            const e = Math.exp(raw[base + c] - maxLogit);
            exps[c - 4] = e;
            sumExp += e;
        }

        let bestProb = 0;
        let bestClass = 0;
        for (let c = 0; c < exps.length; c++) {
            const p = exps[c] / sumExp;
            if (p > bestProb) { bestProb = p; bestClass = c; }
        }

        if (bestProb < scoreThreshold) continue;

        const x1 = (x - w/2) * INPUT_SIZE;
        const y1 = (y - h/2) * INPUT_SIZE;
        const x2 = (x + w/2) * INPUT_SIZE;
        const y2 = (y + h/2) * INPUT_SIZE;

        boxes.push([y1,x1,y2,x2]);
        scores.push(bestProb);
        classIds.push(bestClass);
    }

    if (!boxes.length) return [];

    const boxT = tf.tensor2d(boxes);
    const scoreT = tf.tensor1d(scores);

    const idx = tf.image.nonMaxSuppression(
        boxT, scoreT, MAX_OUTPUT, NMS_IOU, scoreThreshold
    ).arraySync();

    const result = idx.map(i => {
        const [y1,x1,y2,x2] = boxes[i];
        return {x1,y1,x2,y2, score:scores[i], classId:classIds[i]};
    });

    boxT.dispose();
    scoreT.dispose();
    t.dispose();

    return result;
}

/* ----------------------------------------------------------- */
/* LOAD MODEL */
async function loadModel(){
    try{
        statusEl.textContent = "Loading model...";
        progressBar.style.display = "block";

        model = await tf.loadGraphModel(MODEL_URL, {
            onProgress: p => {
                progressFill.style.width = `${p*100}%`;
                statusEl.textContent = `Loading model... ${(p*100).toFixed(1)}%`;
            }
        });

        progressBar.style.display = "none";
        statusEl.textContent = "Model loaded.";
    } catch (e){
        statusEl.textContent = "Model load failed.";
        console.error(e);
    }
}

/* ----------------------------------------------------------- */
/* CAMERA */
async function setupCamera(){
    const stream = await navigator.mediaDevices.getUserMedia({
        video:{ facingMode:"environment" },
        audio:false
    });

    video.srcObject = stream;
    await new Promise(r => video.onloadedmetadata = r);
    video.play();

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    const vc = document.getElementById("video-container");
    vc.style.width  = video.videoWidth + "px";
    vc.style.height = video.videoHeight + "px";
}

/* ----------------------------------------------------------- */
/* REALTIME DETECTION */
async function detectLoop(){
    if (!model) return;

    tf.engine().startScope();

    const input = tf.tidy(() => {
        const img = tf.browser.fromPixels(video);
        return img.resizeBilinear([INPUT_SIZE, INPUT_SIZE])
                  .div(255)
                  .expandDims(0);
    });

    let out = null;
    try {
        out = await model.executeAsync(input);
    } catch (e){
        console.error("Inference failed:", e);
        tf.dispose(input);
        tf.engine().endScope();
        return requestAnimationFrame(detectLoop);
    }

    const det = fastPostprocess(Array.isArray(out) ? out[0] : out, SCORE_THRESHOLD);
    drawBoxes(det);

    tf.dispose([input,out]);
    tf.engine().endScope();

    requestAnimationFrame(detectLoop);
}

/* ----------------------------------------------------------- */
/* MAIN */
(async () => {
    await loadModel();
    await setupCamera();
    statusEl.textContent = "Model ready — Detecting...";
    detectLoop();
})();
</script>

</body>
</html>
