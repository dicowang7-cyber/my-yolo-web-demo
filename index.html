<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOLOv8 Web Realtime Detection (Smooth & Fixed Post-processing)</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.2.0/dist/tf.min.js"></script>

    <style>
        /* CSS Anda yang asli */
        body {
            background-color: #1e1e1e; color: #ffffff; font-family: Arial, sans-serif; margin: 0;
            display: flex; flex-direction: column; align-items: center; padding: 20px;
        }
        h1 { color: #ffffff; font-size: 2em; margin-bottom: 10px; }
        #status-container { margin-bottom: 20px; font-size: 1.1em; color: #b0b0b0; text-align: center; }
        #status { color: lime; font-weight: bold; }
        #progress-bar { width: 300px; height: 10px; background-color: #555; margin-top: 5px; border-radius: 5px; overflow: hidden; display: none; }
        #progress-fill { height: 100%; width: 0%; background-color: lime; transition: width 0.3s; }
        #video-container { position: relative; width: 640px; height: 480px; overflow: hidden; border: 3px solid #333; border-radius: 8px; }
        #canvas { position: absolute; top: 0; left: 0; z-index: 10; }
        #video { visibility: hidden; position: absolute; }
        #fps-info { color: #888; font-size: 0.9em; margin-top: 5px; }
    </style>
</head>
<body>
    <h1>YOLO Web Realtime Detection 🚀</h1>
    
    <div id="status-container">
        <span id="status">Starting up...</span>
        <div id="progress-bar">
            <div id="progress-fill"></div>
        </div>
        <div id="fps-info"></div>
    </div>

    <div id="video-container">
        <video id="video" playsinline muted></video>
        <canvas id="canvas"></canvas>
    </div>

    <script>
        // --- KONFIGURASI GLOBAL ---
        const MODEL_URL = "https://xmrz7019w0uk3zke.public.blob.vercel-storage.com/model.json";
        const statusEl = document.getElementById('status');
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const progressBar = document.getElementById('progress-bar');
        const progressFill = document.getElementById('progress-fill');
        const fpsInfoEl = document.getElementById('fps-info');

        const INPUT_SIZE = 640;
        const SCORE_THRESHOLD = 0.01; // DITURUNKAN: Skor seringkali rendah setelah kuantisasi/transpos
        const NMS_IOU = 0.45;
        const MAX_OUTPUT = 50;
        const NUM_CLASSES = 16;
        const INFERENCE_FPS = 15; // Target inferensi
        const MS_PER_INFERENCE = 1000 / INFERENCE_FPS; 
        let lastInferenceTime = 0;
        let detectionsCache = [];
        let worker;

        const CLASS_NAMES = [
            "Alpukat", "Anggur", "Apel", "Apel Hijau", "Jeruk", "Lemon", "Mangga", "Melon", 
            "Nanas", "Pepaya", "Pir", "Pisang", "Rambutan", "Salak", "Semangka", "Stroberi" 
        ];

        // --- 1. DRAWING DAN RENDERING (MAIN THREAD) ---

        function drawFrame(boxes = []) {
            // Gambar Frame Video (Smooth 60 FPS)
            ctx.save();
            ctx.scale(-1, 1);
            ctx.translate(-canvas.width, 0); 
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            ctx.restore(); 

            // Gambar Deteksi
            boxes.forEach(b => {
                // Koordinat b.x1, b.y1, dll. sudah dinormalisasi (0-1) dari Worker
                const x_normal = canvas.width * b.x1; 
                const w_normal = canvas.width * (b.x2 - b.x1); 

                // Mirroring: x awal deteksi harus dibalik (canvas.width - x2_pixel)
                const x = canvas.width - (canvas.width * b.x2); 
                const y = canvas.height * b.y1;
                const w = w_normal;
                const h = canvas.height * (b.y2 - b.y1);

                // Box
                ctx.strokeStyle = "lime";
                ctx.lineWidth = Math.max(2, Math.round(Math.min(canvas.width, canvas.height) / 200));
                ctx.strokeRect(x, y, w, h);

                // Label
                const label = `${b.className} ${(b.score*100).toFixed(1)}%`; 
                ctx.font = "18px Arial";
                const textW = ctx.measureText(label).width;
                const pad = 6;
                
                ctx.fillStyle = "rgba(0,0,0,0.6)";
                ctx.fillRect(x, y - 22, textW + pad, 22);
                ctx.fillStyle = "lime";
                ctx.fillText(label, x + 4, y - 6);
            });
        }

        function animationLoop(now) {
            drawFrame(detectionsCache); 

            // Kirim frame ke Worker hanya pada interval tertentu
            if (now - lastInferenceTime > MS_PER_INFERENCE && worker) {
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                
                worker.postMessage({
                    type: 'INFER',
                    imageData: imageData.data.buffer,
                    width: canvas.width,
                    height: canvas.height
                }, [imageData.data.buffer]); 
                
                lastInferenceTime = now;
            }

            requestAnimationFrame(animationLoop);
        }

        // --- 2. LOGIKA INLINE WEB WORKER ---

        function createWorker() {
            // Membuat Web Worker dari kode JavaScript dalam bentuk string (Inline Worker)
            const workerCode = `
                importScripts('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.2.0/dist/tf.min.js');

                let model = null;
                const INPUT_SIZE = ${INPUT_SIZE};
                const SCORE_THRESHOLD = ${SCORE_THRESHOLD};
                const NMS_IOU = ${NMS_IOU};
                const MAX_OUTPUT = ${MAX_OUTPUT};
                const NUM_CLASSES = ${NUM_CLASSES};
                const CLASS_NAMES = ${JSON.stringify(CLASS_NAMES)};

                // --- POST-PROCESSING KRITIS (YOLOv8 Fixed) ---

                async function postprocess(outputTensor) {
                    let results = [];
                    
                    const [finalBoxes, finalScores, finalClassIds] = tf.tidy(() => {
                        
                        // Output: [1, 20, 8400] -> Transpose menjadi: [8400, 20]
                        const transposed = outputTensor.squeeze([0]).transpose([1, 0]);

                        // 1. Pisahkan Bounding Box (4) dan Class Logits (16)
                        const boxes = transposed.slice([0, 0], [-1, 4]); 
                        const classScores = transposed.slice([0, 4], [-1, NUM_CLASSES]); 

                        // 2. Cari Max Score dan Max Class ID
                        const maxScores = classScores.max(1); 
                        const classIds = classScores.argMax(1); 
                        
                        // --- Filtering Awal menggunakan Threshold ---
                        const validScoresMask = maxScores.greater(SCORE_THRESHOLD); 
                        const validIndices = validScoresMask.where(validScoresMask, tf.zerosLike(validScoresMask)).arraySync().map((isValid, index) => isValid === 1 ? index : -1).filter(i => i !== -1);

                        if (validIndices.length === 0) {
                            return [tf.tensor2d([]), tf.tensor1d([]), tf.tensor1d([])];
                        }

                        const filteredBoxes = boxes.gather(validIndices);
                        const filteredScores = maxScores.gather(validIndices);
                        const filteredClassIds = classIds.gather(validIndices);
                        
                        // 3. Ubah format dari XYWH ke XYXY (Normalisasi ke 0-1 untuk NMS)
                        const [x, y, w, h] = tf.split(filteredBoxes, 4, 1);
                        
                        const x1 = tf.sub(x, tf.div(w, 2));
                        const y1 = tf.sub(y, tf.div(h, 2));
                        const x2 = tf.add(x, tf.div(w, 2));
                        const y2 = tf.add(y, tf.div(h, 2));
                        
                        // Gabungkan dalam format NMS [y1, x1, y2, x2]
                        const nmsBoxes = tf.stack([tf.div(y1, INPUT_SIZE), tf.div(x1, INPUT_SIZE), tf.div(y2, INPUT_SIZE), tf.div(x2, INPUT_SIZE)], 1);
                        
                        return [nmsBoxes, filteredScores, filteredClassIds];
                    });

                    // 4. Non-Max Suppression (NMS)
                    const selectedIdx = await tf.image.nonMaxSuppressionAsync(
                        finalBoxes, finalScores, MAX_OUTPUT, NMS_IOU, SCORE_THRESHOLD
                    );
                    
                    // 5. Ambil hasil akhir
                    const finalBoxesArray = await finalBoxes.gather(selectedIdx).array();
                    const finalScoresArray = await finalScores.gather(selectedIdx).array();
                    const finalClassIdsArray = await finalClassIds.gather(selectedIdx).array();
                    
                    // 6. Format hasil
                    for (let i = 0; i < finalScoresArray.length; i++) {
                        const [y1, x1, y2, x2] = finalBoxesArray[i];
                        
                        results.push({
                            // Koordinat dikirim kembali sebagai nilai 0-1
                            x1: x1, y1: y1, x2: x2, y2: y2, 
                            score: finalScoresArray[i],
                            classId: finalClassIdsArray[i],
                            className: CLASS_NAMES[finalClassIdsArray[i]]
                        });
                    }

                    tf.dispose([finalBoxes, finalScores, finalClassIds, selectedIdx]);
                    return results;
                }

                // --- Worker Handlers ---
                async function runInference(data) {
                    if (!model) return;
                    
                    const startTime = performance.now();
                    const pixels = new Uint8ClampedArray(data.imageData);
                    const imageTensor = tf.tensor4d(pixels, [data.height, data.width, 4]).slice([0, 0, 0], [-1, -1, 3]);

                    tf.engine().startScope();
                    
                    const input = tf.tidy(() => {
                        return imageTensor.resizeBilinear([INPUT_SIZE, INPUT_SIZE])
                                          .div(255.0) 
                                          .expandDims(0); 
                    });

                    let output = null;
                    try {
                        const res = await model.executeAsync(input);
                        output = Array.isArray(res) ? res[0] : res;
                    } catch (err) {
                        console.error("Inference failed in worker:", err);
                        tf.dispose([input, imageTensor]);
                        tf.engine().endScope();
                        return;
                    }
                    
                    const detections = await postprocess(output);
                    
                    tf.dispose([input, output, imageTensor]); 
                    tf.engine().endScope();
                    
                    const inferenceTime = performance.now() - startTime;

                    postMessage({
                        type: 'RESULT',
                        boxes: detections,
                        fps: 1000 / inferenceTime,
                    });
                }

                self.onmessage = async (event) => {
                    const data = event.data;

                    if (data.type === 'INIT') {
                        tf.setBackend('webgl').then(async () => {
                            try {
                                model = await tf.loadGraphModel(data.modelUrl, {
                                    onProgress: (fraction) => {
                                        postMessage({ type: 'LOADING', progress: (fraction * 100) });
                                    }
                                });
                                // Warm-up
                                model.predict(tf.zeros([1, INPUT_SIZE, INPUT_SIZE, 3])).dispose();
                                postMessage({ type: 'LOADED' });
                            } catch (err) {
                                postMessage({ type: 'ERROR', message: 'Failed to load model in worker.' });
                            }
                        });
                    } else if (data.type === 'INFER') {
                        runInference(data);
                    }
                };
            `;

            const blob = new Blob([workerCode], { type: 'application/javascript' });
            const url = URL.createObjectURL(blob);
            return new Worker(url);
        }

        // --- 3. INISIALISASI ---

        function setupWorker() {
            worker = createWorker();

            worker.onmessage = (event) => {
                const data = event.data;
                if (data.type === 'LOADING') {
                    progressBar.style.display = 'block';
                    statusEl.textContent = `Loading model... ${data.progress.toFixed(1)}%`;
                    progressFill.style.width = `${data.progress}%`;
                } else if (data.type === 'LOADED') {
                    progressBar.style.display = 'none';
                    statusEl.textContent = "Model ready — running detection.";
                } else if (data.type === 'ERROR') {
                    statusEl.textContent = `Worker Error: ${data.message}`;
                } else if (data.type === 'RESULT') {
                    detectionsCache = data.boxes; 
                    fpsInfoEl.textContent = `Inferensi: ${data.fps.toFixed(1)} FPS | Detections: ${data.boxes.length}`;
                }
            };

            worker.postMessage({
                type: 'INIT',
                modelUrl: MODEL_URL
            });
        }

        async function setupCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "user" }, // Ubah ke "user" untuk mirroring yang lebih mudah
                    audio: false
                });
                video.srcObject = stream;
                await new Promise(resolve => video.onloadedmetadata = resolve);
                video.play();
                
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                document.getElementById('video-container').style.width = `${video.videoWidth}px`;
                document.getElementById('video-container').style.height = `${video.videoHeight}px`;

                animationLoop(0); 

            } catch (err) {
                console.error("Camera error:", err);
                statusEl.textContent = "Camera error. Allow camera and reload.";
            }
        }

        (async () => {
            setupWorker();
            await setupCamera();
        })();
    </script>
</body>
</html>
